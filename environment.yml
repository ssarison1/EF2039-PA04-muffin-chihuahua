# Exact environment used for all experiments in the paper.
# Create with: conda env create -f environment.yml
name: pa04
channels:
  - conda-forge
dependencies:
  - python=3.11.18
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128
      - torchvision==0.26.0+cu128
      - numpy==2.4.6
      - pandas==3.1.0
      - matplotlib==3.11.2
      - scikit-learn==1.9.1
      - pillow==13.0.0
      - tqdm==4.70.1
      - kaggle==2.2.5
      - six==1.17.0
